# Butterfly overrides for RyuriHime
# Defaults are deep-merged from the theme's _config.yml.

nav:
  display_title: true
  display_post_title: true
  fixed: true

menu:
  "首页": "/ || fas fa-home"
  "归档": "/archives/ || fas fa-clock"
  "标签": "/tags/ || fas fa-tags"
  "关于": "/about/ || fas fa-heart"
social:
  fab fa-github: https://github.com/RyuriHime || GitHub || '#c9a4ff'
  fas fa-code: https://www.luogu.com.cn/user/61158 || Luogu || '#7ee7d8'
  fas fa-rss: /atom.xml || RSS || '#ffd79a'

favicon: /images/avatar-round.png

avatar:
  img: /images/avatar.webp
  effect: false

disable_top_img: false
default_top_img: /images/banner.svg
index_img: /images/banner.svg
archive_img: /images/banner.svg
tag_img: /images/banner.svg
category_img: /images/banner.svg
footer_img: false

# Creates the full-page wallpaper layer. The paid/private image is injected by
# source/assets/private/private-assets.css at build time.
background: /images/banner.svg

cover:
  index_enable: false
  aside_enable: false
  archives_enable: false
  default_cover:
    - /images/covers/misc.svg

error_img:
  flink: /images/favicon.svg
  post_page: /images/favicon.svg

error_404:
  enable: true
  subtitle: "页面不存在或已被移动"
  background: /images/banner.svg

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true
  post:
    position: left
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true

index_site_info_top: 44%
index_top_img_height: 100vh

subtitle:
  enable: false
  effect: false
  source: false
  sub: []

index_layout: 3
index_post_content:
  method: 1
  length: 180

toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/RyuriHime
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

post_edit:
  enable: false

related_post:
  enable: true
  limit: 4
  date_type: created

post_pagination: 1

noticeOutdate:
  enable: false

footer:
  nav:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: true
  custom_text: ""

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: ""
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/RyuriHime
  card_announcement:
    enable: false
    content: ""
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_newest_comments:
    enable: false
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 30
    color: true
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: YYYY 年 MM 月
    order: -1
    limit: 6
  card_post_series:
    enable: false
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: '11/18/2026 12:00:00'

rightside_bottom:
translate:
  enable: false
readmode: true

darkmode:
  enable: false
  button: false
  autoChangeMode: false

rightside_scroll_percent: true

anchor:
  auto_update: true
  click_to_scroll: true

photofigcaption: false

copy:
  enable: true
  copyright:
    enable: false

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

math:
  use: mathjax
  per_page: false
  hide_scrollbar: true
  mathjax:
    enableMenu: false
    tags: none

search:
  use: local_search
  placeholder: '搜索文章、标签或关键词…'
  local_search:
    preload: true
    top_n_per_article: 1
    unescape: false

lightbox: medium_zoom

lazyload:
  enable: false

code_blocks:
  theme: darker
  macStyle: true
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

theme_color:
  enable: true
  main: "#8b5cf6"
  paginator: "#d7609b"
  button_hover: "#b07c2c"
  text_selection: "#c9a4ff"
  link_color: "#7447a8"
  meta_color: "#7f718b"
  hr_color: "#bda4d8"
  code_foreground: "#5f3b7f"
  code_background: "rgba(139, 92, 246, .08)"
  toc_color: "#b44a86"
  blockquote_padding_color: "#8b5cf6"
  blockquote_background_color: "#8b5cf6"
  scrollbar_color: "#c9a4ff"
  meta_theme_color_light: "ffffff"
  meta_theme_color_dark: "#0d0d0d"

category_ui: index
tag_ui: index
rounded_corners_ui: true
text_align_justify: false

mask:
  header: true
  footer: true

preloader:
  enable: false

enter_transitions: false
display_mode: light

structured_data:
  enable: true
  alternate_name:
    - RyuriHime Blog
    - RyuriHime 的博客

# Third-party assets use a jsDelivr mirror that is reachable from mainland
# China. cdn.jsdelivr.net itself is frequently blocked there, which left icons,
# medium-zoom and MathJax unloaded.
CDN:
  internal_provider: local
  third_party_provider: custom
  version: true
  custom_format: https://cdn.jsdmirror.com/npm/${name}@${version}/${min_file}

inject:
  head:
    - <link rel="stylesheet" href="/css/vtuber.css">
  bottom:
    - <script src="/js/wallpaper.js" defer></script>
    - <script src="/js/vtuber.js" defer></script>
